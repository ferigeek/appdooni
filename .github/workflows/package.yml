name: Package & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux
            arch: amd64
            runner: ubuntu-latest
            pkg_type: deb
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            pkg_type: deb
          - platform: windows
            arch: x64
            runner: windows-latest
            pkg_type: msi
          - platform: macos
            arch: x64
            runner: macos-13
            pkg_type: dmg
          - platform: macos
            arch: arm64
            runner: macos-latest
            pkg_type: dmg

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Print diagnostics
        shell: bash
        run: |
          echo "=== Java ==="
          java -version 2>&1
          echo ""
          echo "=== Maven ==="
          mvn --version 2>&1
          echo ""
          echo "=== jpackage ==="
          jpackage --version 2>&1 || echo "(version flag not supported)"
          echo ""
          echo "=== Runner ==="
          echo "OS:   ${{ runner.os }}"
          echo "Arch: ${{ runner.arch }}"

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg

      - name: Run tests
        shell: bash
        run: mvn clean test

      - name: Build jlink image
        shell: bash
        run: mvn javafx:jlink

      - name: Verify jlink output
        shell: bash
        run: |
          if [ ! -d "target/app" ]; then
            echo "::error::target/app directory not found after javafx:jlink"
            exit 1
          fi
          if [ ! -f "target/app/bin/app" ] && [ ! -f "target/app/bin/app.bat" ]; then
            echo "::error::jlink launcher script not found in target/app/bin/"
            exit 1
          fi
          echo "jlink image verified at target/app/"
          ls target/app/

      - name: Run jpackage
        shell: bash
        run: |
          jpackage \
            --type "${{ matrix.pkg_type }}" \
            --name AppDooni \
            --app-version "${{ steps.version.outputs.version }}" \
            --vendor "ferigeek" \
            --description "AppDooni - Application Catalog" \
            --runtime-image target/app \
            --module com.github.ferigeek.appdooni/com.github.ferigeek.appdooni.Launcher \
            --dest target/jpackage

      - name: Verify and rename package
        id: pkg
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PLATFORM="${{ matrix.platform }}"
          ARCH="${{ matrix.arch }}"

          echo "Contents of target/jpackage/:"
          ls -la target/jpackage/ || {
            echo "::error::target/jpackage/ directory not found"
            exit 1
          }

          PACKAGE_FILE=$(find target/jpackage -maxdepth 1 -type f \
            \( -name "*.deb" -o -name "*.msi" -o -name "*.dmg" \) | head -1)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "::error::No package file found in target/jpackage/"
            exit 1
          fi

          echo "Found package: $PACKAGE_FILE"

          case "${PLATFORM}" in
            linux)   EXT="deb" ;;
            windows) EXT="msi" ;;
            macos)   EXT="dmg" ;;
          esac
          EXPECTED="AppDooni-${VERSION}-${PLATFORM}-${ARCH}.${EXT}"

          cp "$PACKAGE_FILE" "target/jpackage/${EXPECTED}"

          echo "artifact_name=${EXPECTED}" >> "$GITHUB_OUTPUT"
          echo "package_path=target/jpackage/${EXPECTED}" >> "$GITHUB_OUTPUT"
          echo "Created: ${EXPECTED}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.artifact_name }}
          path: ${{ steps.pkg.outputs.package_path }}
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-packages
          pattern: AppDooni-*

      - name: List downloaded packages
        shell: bash
        run: |
          echo "Downloaded packages:"
          find release-packages -type f | sort

      - name: Verify all packages exist
        shell: bash
        run: |
          EXPECTED_PATTERNS=(
            "AppDooni-*-linux-amd64.deb"
            "AppDooni-*-linux-arm64.deb"
            "AppDooni-*-windows-x64.msi"
            "AppDooni-*-macos-x64.dmg"
            "AppDooni-*-macos-arm64.dmg"
          )

          MISSING=0
          for pattern in "${EXPECTED_PATTERNS[@]}"; do
            if ! find release-packages -name "$pattern" -print -quit 2>/dev/null | grep -q .; then
              echo "::error::Missing package: $pattern"
              MISSING=1
            fi
          done

          if [ "$MISSING" -eq 1 ]; then
            echo "::error::Not all expected packages found. Aborting release."
            exit 1
          fi

          echo "All 5 expected packages verified."

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"

          mapfile -t FILES < <(
            find release-packages -type f \
              \( -name "*.deb" -o -name "*.msi" -o -name "*.dmg" \) | sort
          )

          echo "Creating release: AppDooni v${VERSION}"
          echo "Tag:            ${GITHUB_REF_NAME}"
          echo "Files:          ${#FILES[@]}"

          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "AppDooni v${VERSION}" \
            --generate-notes \
            "${FILES[@]}"
