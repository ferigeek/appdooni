name: Package & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Application version (example: 1.0.0). Used for manual testing only; releases are created only from v* tags.'
        required: true
        default: '0.0.0'

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: amd64
            runner: ubuntu-latest
            pkg_type: deb
          - platform: windows
            arch: x64
            runner: windows-latest
            pkg_type: msi
          - platform: macos
            arch: x64
            runner: macos-15-intel
            pkg_type: dmg
          - platform: macos
            arch: arm64
            runner: macos-latest
            pkg_type: dmg

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ inputs.version }}"
            echo "::warning::Manual build with version $VERSION. Testing only - no release will be created."
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Print diagnostics
        shell: bash
        run: |
          echo "=== Java ==="
          java -version 2>&1
          echo ""
          echo "=== Maven ==="
          mvn --version 2>&1
          echo ""
          echo "=== jpackage ==="
          jpackage --version 2>&1 || echo "(version flag not supported)"
          echo ""
          echo "=== Runner ==="
          echo "OS:   ${{ runner.os }}"
          echo "Arch: ${{ runner.arch }}"

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg

      - name: Run tests
        shell: bash
        run: mvn clean test

      - name: Build jlink image
        shell: bash
        run: mvn javafx:jlink

      - name: Verify jlink output
        shell: bash
        run: |
          if [ ! -d "target/app" ]; then
            echo "::error::target/app directory not found after javafx:jlink"
            exit 1
          fi
          if [ ! -f "target/app/bin/app" ] && [ ! -f "target/app/bin/app.bat" ]; then
            echo "::error::jlink launcher script not found in target/app/bin/"
            exit 1
          fi
          echo "jlink image verified at target/app/"
          ls target/app/

      - name: Run jpackage
        shell: bash
        run: |
          JPACKAGE_ARGS=(
            --type "${{ matrix.pkg_type }}"
            --name AppDooni
            --app-version "${{ steps.version.outputs.version }}"
            --vendor "ferigeek"
            --description "AppDooni - Application Catalog"
            --runtime-image target/app
            --module com.github.ferigeek.appdooni/com.github.ferigeek.appdooni.Launcher
            --dest target/jpackage
          )
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            JPACKAGE_ARGS+=(--linux-shortcut --linux-menu-group "Utilities" --icon packaging/appdooni.png)
          fi
          echo "Running jpackage with args: ${JPACKAGE_ARGS[*]}"
          jpackage "${JPACKAGE_ARGS[@]}"

      - name: Verify Linux desktop entry
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          DEB=$(find target/jpackage -maxdepth 1 -type f -name "*.deb" | head -1)
          if [ -z "$DEB" ]; then
            echo "::error::No .deb found for Linux desktop verification"
            exit 1
          fi
          echo "Checking $DEB for .desktop entry..."
          dpkg-deb --contents "$DEB" | tee /tmp/deb-contents.txt
          if ! grep -q "\.desktop" /tmp/deb-contents.txt; then
            echo "::error::No .desktop entry found in $DEB"
            exit 1
          fi
          echo "Found .desktop entries in deb data:"
          grep "\.desktop" /tmp/deb-contents.txt

          # jpackage deb stores desktop in /opt/<name>/lib/*.desktop and installs via xdg-desktop-menu in postinst
          # Verify postinst installs to /usr/share/applications
          echo "Checking postinst for xdg-desktop-menu..."
          if ! dpkg-deb --ctrl-tarfile "$DEB" | tar -O -x ./postinst 2>/dev/null | grep -q "xdg-desktop-menu.*install"; then
            echo "::warning::postinst does not contain xdg-desktop-menu install (desktop may still be in data)"
            # Fallback: check data directly under /usr/share/applications
            if ! grep -q "usr/share/applications/.*\\.desktop" /tmp/deb-contents.txt; then
              echo "::error::Neither postinst xdg install nor direct /usr/share/applications entry found"
              exit 1
            fi
          else
            echo "postinst installs desktop via xdg-desktop-menu (will appear under /usr/share/applications after install)"
            dpkg-deb --ctrl-tarfile "$DEB" | tar -O -x ./postinst | grep "xdg-desktop-menu"
          fi

          TMPDIR=$(mktemp -d)
          dpkg-deb --extract "$DEB" "$TMPDIR"
          DESKTOP=$(find "$TMPDIR" -name "*.desktop" | head -1)
          if [ -z "$DESKTOP" ]; then
            echo "::error::Could not extract .desktop file from $DEB"
            rm -rf "$TMPDIR"
            exit 1
          fi
          echo "Desktop file: $DESKTOP"
          cat "$DESKTOP"
          echo "---"
          if ! grep -qi "^Icon=" "$DESKTOP"; then
            echo "::error::Desktop entry missing Icon field"
            rm -rf "$TMPDIR"
            exit 1
          fi
          echo "Icon field:"
          grep -i "^Icon=" "$DESKTOP"
          if ! grep -qi "^Icon=.*AppDooni" "$DESKTOP"; then
            echo "::error::Icon field does not reference AppDooni (expected Icon=AppDooni)"
            rm -rf "$TMPDIR"
            exit 1
          fi
          if grep -qi "^Categories=.*Utilities" "$DESKTOP"; then
            echo "Menu group Utilities verified via Categories=Utilities"
          else
            echo "::warning::Categories does not contain Utilities"
          fi
          # Verify icon file exists in package
          if ! grep -q "AppDooni.png" /tmp/deb-contents.txt; then
            echo "::error::Icon png not found in deb package"
            rm -rf "$TMPDIR"
            exit 1
          fi
          echo "Icon file in package:"
          grep "AppDooni.png" /tmp/deb-contents.txt
          rm -rf "$TMPDIR"
          echo "Linux desktop entry verification passed — will appear under /usr/share/applications/ after install."

      - name: Verify and rename package
        id: pkg
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PLATFORM="${{ matrix.platform }}"
          ARCH="${{ matrix.arch }}"

          echo "Contents of target/jpackage/:"
          ls -la target/jpackage/ || {
            echo "::error::target/jpackage/ directory not found"
            exit 1
          }

          PACKAGE_FILE=$(find target/jpackage -maxdepth 1 -type f \
            \( -name "*.deb" -o -name "*.msi" -o -name "*.dmg" \) | head -1)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "::error::No package file found in target/jpackage/"
            exit 1
          fi

          echo "Found package: $PACKAGE_FILE"

          case "${PLATFORM}" in
            linux)   EXT="deb" ;;
            windows) EXT="msi" ;;
            macos)   EXT="dmg" ;;
          esac
          EXPECTED="AppDooni-${VERSION}-${PLATFORM}-${ARCH}.${EXT}"

          cp "$PACKAGE_FILE" "target/jpackage/${EXPECTED}"

          echo "artifact_name=${EXPECTED}" >> "$GITHUB_OUTPUT"
          echo "package_path=target/jpackage/${EXPECTED}" >> "$GITHUB_OUTPUT"
          echo "Created: ${EXPECTED}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.artifact_name }}
          path: ${{ steps.pkg.outputs.package_path }}
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-packages
          pattern: AppDooni-*

      - name: List downloaded packages
        shell: bash
        run: |
          echo "Downloaded packages:"
          find release-packages -type f | sort

      - name: Verify all packages exist
        shell: bash
        run: |
          EXPECTED_PATTERNS=(
            "AppDooni-*-linux-amd64.deb"
            "AppDooni-*-windows-x64.msi"
            "AppDooni-*-macos-x64.dmg"
            "AppDooni-*-macos-arm64.dmg"
          )

          MISSING=0
          for pattern in "${EXPECTED_PATTERNS[@]}"; do
            if ! find release-packages -name "$pattern" -print -quit 2>/dev/null | grep -q .; then
              echo "::error::Missing package: $pattern"
              MISSING=1
            fi
          done

          if [ "$MISSING" -eq 1 ]; then
            echo "::error::Not all expected packages found. Aborting release."
            exit 1
          fi

          echo "All 4 expected packages verified."

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"

          mapfile -t FILES < <(
            find release-packages -type f \
              \( -name "*.deb" -o -name "*.msi" -o -name "*.dmg" \) | sort
          )

          echo "Creating release: AppDooni v${VERSION}"
          echo "Tag:            ${GITHUB_REF_NAME}"
          echo "Files:          ${#FILES[@]}"

          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "AppDooni v${VERSION}" \
            --generate-notes \
            "${FILES[@]}"
